<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Hand-drawn for the 1x toolbar, every edge on a whole pixel. Ring: 8x8 in columns 4-11 and rows 2-9, 2 px
       stroke, 1 px cut corners, 4x4 hole. Stub: rows 0-1. History: rows 10-15. The stub and the ring's rows 2-6 sit
       above Chrome's badge (bottom 9 rows, from column 7 for "!" and column 5 for "OK"). The tile is #1c1e24, a
       near-black outside GitHub's palette; the 16 % white keyline keeps its edge on dark toolbars. -->
  <rect width="16" height="16" rx="3.5" fill="#1c1e24" shape-rendering="geometricPrecision"/>
  <rect x=".5" y=".5" width="15" height="15" rx="3" fill="none" stroke="#fff" stroke-opacity=".16" shape-rendering="geometricPrecision"/>
  <g fill="#fff">
    <rect x="7" y="0" width="2" height="2"/>
    <path fill-rule="evenodd" d="M5 2H11V3H12V9H11V10H5V9H4V3H5ZM6 4V8H10V4Z"/>
    <rect x="7" y="10" width="2" height="6"/>
  </g>
</svg>
