<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hand-tuned for the 2x toolbar: 4 px strokes. The ring's outer edge (rows 5-21, columns 8-24) and its hole
       (9-17) land on whole pixels. The line stops 3 px short of the tile edge, so the tile stays whole. The tile is
       #1c1e24, a near-black outside GitHub's palette, with a 16 % white keyline for dark toolbars. -->
  <rect width="32" height="32" rx="7" fill="#1c1e24"/>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#fff" stroke-opacity=".16"/>
  <g fill="#fff">
    <rect x="14" y="3" width="4" height="3"/>
    <rect x="14" y="20" width="4" height="9"/>
  </g>
  <circle cx="16" cy="13" r="6" fill="none" stroke="#fff" stroke-width="4"/>
</svg>
