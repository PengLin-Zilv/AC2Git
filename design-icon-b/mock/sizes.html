<!doctype html><meta charset="utf-8"><title>AC2Git icon sizes</title><style>
body{margin:0;padding:12px;font:11px/14px system-ui,sans-serif;background:#e8eaed;color:#3c4043}
.p{display:inline-flex;gap:14px;align-items:flex-end;padding:12px;margin:0 10px 10px 0;border-radius:8px}
.l{background:#fff}.d{background:#202124;color:#e8eaed}
figure{margin:0;text-align:center}figcaption{margin-top:4px}
.z{image-rendering:pixelated}
</style><body><script>
const set=[['icon16.png',16,8],['icon32.png',32,4],['icon48.png',48,2],['icon128.png',128,1]];
for(const t of ['l','d']){let h=`<div class="p ${t}">`;
 for(const [f,s,z] of set) h+=`<figure><img class="z" src="../png/${f}" width="${s*z}" height="${s*z}"><figcaption>${s} px ×${z}</figcaption></figure>`;
 for(const [f,s] of set) h+=`<figure><img src="../png/${f}" width="${s}" height="${s}"><figcaption>${s}</figcaption></figure>`;
 document.body.insertAdjacentHTML('beforeend',h+'</div>');}
</script>
