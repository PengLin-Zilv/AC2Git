<!doctype html>
<meta charset="utf-8">
<title>AC2Git icon in the toolbar</title>
<!-- Badge geometry from Chromium's icon_with_badge_image_source.cc: a 28 px icon area with the 16 px icon centred,
     badge 14 px tall, flush with the bottom, right-aligned when under 20 px wide, 2 px padding, radius 4, and a
     1 px cutout around it (drawn here as a ring in the toolbar colour). Badge font approximated as 9 px bold. -->
<style>
  body { margin: 0; padding: 10px; font: 11px/14px system-ui, sans-serif; color: #59636e; background: #f6f8fa; width: max-content; }
  .strip { display: flex; align-items: center; gap: 2px; height: 36px; padding: 0 10px; border-radius: 8px; margin-bottom: 4px; }
  .light { background: #ffffff; box-shadow: 0 0 0 1px #d8dee4; --tb: #ffffff; }
  .dark { background: #35363a; --tb: #35363a; }
  .btn { position: relative; width: 28px; height: 28px; }
  .btn img, .btn .tile { position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; }
  .tile { border-radius: 3px; background: #7c8087; color: #fff; font: 600 11px/16px system-ui; text-align: center; }
  .badge { position: absolute; right: 0; bottom: 0; height: 14px; border-radius: 4px; color: #fff;
           font: 700 9px/14px system-ui, sans-serif; text-align: center; box-shadow: 0 0 0 1px var(--tb); }
  .ok { width: 16px; background: #1a7f37; }
  .err { width: 14px; background: #cf222e; }
  .gap { width: 14px; }
  .labels { display: flex; gap: 2px; padding: 0 10px; }
  .labels span { width: 28px; text-align: center; }
</style>
<div class="strip light">
  <div class="btn"><div class="tile">A</div></div><div class="gap"></div>
  <div class="btn"><img srcset="icon16.png 1x, icon32.png 2x" alt=""></div>
  <div class="btn"><img srcset="icon16.png 1x, icon32.png 2x" alt=""><span class="badge ok">OK</span></div>
  <div class="btn"><img srcset="icon16.png 1x, icon32.png 2x" alt=""><span class="badge err">!</span></div>
</div>
<div class="strip dark">
  <div class="btn"><div class="tile">A</div></div><div class="gap"></div>
  <div class="btn"><img srcset="icon16.png 1x, icon32.png 2x" alt=""></div>
  <div class="btn"><img srcset="icon16.png 1x, icon32.png 2x" alt=""><span class="badge ok">OK</span></div>
  <div class="btn"><img srcset="icon16.png 1x, icon32.png 2x" alt=""><span class="badge err">!</span></div>
</div>
